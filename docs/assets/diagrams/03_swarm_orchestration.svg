<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" fill="#07090E" rx="16"/>
  <rect x="1" y="1" width="1198" height="698" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="50" y="55" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="bold">AI-001: Multi-Agent Swarm Orchestration &amp; Dependency Graph</text>
  <rect x="970" y="35" width="180" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="#6366F1" stroke-width="1"/>
  <text x="990" y="54" fill="#A5B4FC" font-family="sans-serif" font-size="12" font-weight="600">Swarm Architecture</text>

  <!-- Input -->
  <rect x="450" y="100" width="300" height="70" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="480" y="130" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="bold">Raw Concept Brief</text>
  <text x="480" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Text / Voice Note / URL / PDF Brief</text>

  <!-- Parallel Agents -->
  <line x1="600" y1="170" x2="600" y2="220" stroke="#6366F1" stroke-width="2"/>
  <line x1="200" y1="220" x2="1000" y2="220" stroke="#6366F1" stroke-width="2"/>

  <!-- Agent 1 -->
  <rect x="80" y="240" width="240" height="110" rx="10" fill="#151D2F" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="100" y="270" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">Research Agent</text>
  <text x="100" y="295" fill="#94A3B8" font-family="sans-serif" font-size="12">• Live Google Search</text>
  <text x="100" y="315" fill="#94A3B8" font-family="sans-serif" font-size="12">• Fact &amp; Citation Extractor</text>

  <!-- Agent 2 -->
  <rect x="360" y="240" width="240" height="110" rx="10" fill="#151D2F" stroke="#6366F1" stroke-width="1.5"/>
  <text x="380" y="270" fill="#A5B4FC" font-family="sans-serif" font-size="14" font-weight="bold">Scripting Agent</text>
  <text x="380" y="295" fill="#94A3B8" font-family="sans-serif" font-size="12">• Tone Vector Alignment</text>
  <text x="380" y="315" fill="#94A3B8" font-family="sans-serif" font-size="12">• Omnichannel Copywriting</text>

  <!-- Agent 3 -->
  <rect x="640" y="240" width="240" height="110" rx="10" fill="#151D2F" stroke="#EC4899" stroke-width="1.5"/>
  <text x="660" y="270" fill="#F472B6" font-family="sans-serif" font-size="14" font-weight="bold">Visual &amp; Voice Swarm</text>
  <text x="660" y="295" fill="#94A3B8" font-family="sans-serif" font-size="12">• Storyboard Generator</text>
  <text x="660" y="315" fill="#94A3B8" font-family="sans-serif" font-size="12">• 5-Band Neural Speech</text>

  <!-- Agent 4 -->
  <rect x="920" y="240" width="200" height="110" rx="10" fill="#151D2F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="940" y="270" fill="#FCD34D" font-family="sans-serif" font-size="14" font-weight="bold">Code Compiler</text>
  <text x="940" y="295" fill="#94A3B8" font-family="sans-serif" font-size="12">• AST Syntax Check</text>
  <text x="940" y="315" fill="#94A3B8" font-family="sans-serif" font-size="12">• SVG Architecture XML</text>

  <!-- Merge to Veritas -->
  <line x1="200" y1="350" x2="600" y2="440" stroke="#64748B" stroke-width="1.5"/>
  <line x1="480" y1="350" x2="600" y2="440" stroke="#64748B" stroke-width="1.5"/>
  <line x1="760" y1="350" x2="600" y2="440" stroke="#64748B" stroke-width="1.5"/>
  <line x1="1020" y1="350" x2="600" y2="440" stroke="#64748B" stroke-width="1.5"/>

  <!-- Veritas Gate -->
  <rect x="400" y="440" width="400" height="90" rx="12" fill="#111827" stroke="#14B8A6" stroke-width="2"/>
  <text x="440" y="475" fill="#2DD4BF" font-family="sans-serif" font-size="16" font-weight="bold">Veritas Quality &amp; Consensus Gate</text>
  <text x="440" y="505" fill="#94A3B8" font-family="sans-serif" font-size="13">Multi-Model Verification &amp; C2PA Provenance Signing</text>

  <!-- Output Channels -->
  <line x1="600" y1="530" x2="600" y2="580" stroke="#14B8A6" stroke-width="2"/>
  <rect x="350" y="580" width="500" height="70" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="400" y="610" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">Published Multi-Channel Assets (VQS ≥ 90)</text>
  <text x="410" y="635" fill="#94A3B8" font-family="sans-serif" font-size="12">YouTube Shorts | LinkedIn Carousels | X Threads | Substack</text>
