    <text x="30" y="35" fill="#0F766E" font-family="sans-serif" font-size="16" font-weight="bold">Veritas 5-Axis Quality Firewall &amp; C2PA Cryptographic Signer</text>
    <text x="30" y="60" fill="#334155" font-family="sans-serif" font-size="12">Evaluates Factuality (30%), Tone (25%), Consensus (20%), Safety (15%), Human (10%)</text>
    <text x="30" y="85" fill="#15803D" font-family="sans-serif" font-size="12" font-weight="bold">✓ VQS = 94.6 (PASS) -> Issues Signed C2PA Content Credentials Certificate</text>
