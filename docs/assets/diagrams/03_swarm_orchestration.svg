  <g transform="translate(380, 375)">
    <rect width="290" height="230" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" filter="url(#cardShadow3)"/>
    <rect width="290" height="38" rx="10" fill="#EEF2FF"/>
