    <text x="15" y="185" fill="#D97706" font-family="sans-serif" font-size="11" font-weight="bold">Engine: AST Checker + mxGraph</text>
    <text x="15" y="210" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] 0 Syntax Errors</text>
  </g>

  <!-- Convergence to Veritas -->
  <line x1="195" y1="605" x2="720" y2="670" stroke="#64748B" stroke-width="1.5"/>
  <line x1="525" y1="605" x2="720" y2="670" stroke="#64748B" stroke-width="1.5"/>
  <line x1="855" y1="605" x2="720" y2="670" stroke="#64748B" stroke-width="1.5"/>
  <line x1="1215" y1="605" x2="720" y2="670" stroke="#64748B" stroke-width="1.5"/>

