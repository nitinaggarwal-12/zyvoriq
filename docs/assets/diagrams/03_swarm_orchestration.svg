      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrIndigo3" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#4F46E5"/></marker>
    <marker id="arrTeal3" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#0D9488"/></marker>
  </defs>

  <rect width="1440" height="900" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1438" height="898" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header -->
  <text x="50" y="52" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="-0.5px">AI-001: Multi-Agent Swarm Orchestration &amp; Dependency Graph</text>
  <text x="50" y="78" fill="#475569" font-family="sans-serif" font-size="13" font-weight="500">Decoupled Agent Topology: Raw Concept -> Director Graph -> Parallel Media Swarms -> Veritas Assurance Gate</text>

  <rect x="1150" y="32" width="240" height="32" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/>
  <text x="1170" y="53" fill="#4338CA" font-family="sans-serif" font-size="13" font-weight="bold">Multi-Agent Swarm Architecture</text>

  <!-- Input Concept Box -->
  <g transform="translate(520, 110)">
