    <text x="15" y="210" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] 30+ Languages Ready</text>
  </g>

  <!-- Agent 4: Code & Diagrams -->
  <g transform="translate(1040, 375)">
    <rect width="350" height="230" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#cardShadow3)"/>
