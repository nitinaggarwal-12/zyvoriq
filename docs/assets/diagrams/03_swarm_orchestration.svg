    <text x="25" y="32" fill="#0369A1" font-family="sans-serif" font-size="16" font-weight="bold">Raw Multimodal Concept Brief</text>
    <text x="25" y="55" fill="#334155" font-family="sans-serif" font-size="12">Input: Text Thesis, Audio Memo, GitHub Repo, or PDF Brief</text>
    <text x="25" y="75" fill="#0D9488" font-family="sans-serif" font-size="11" font-weight="bold">Status: Parsed &amp; Vectorized into Workspace Context</text>
  </g>

