    <text x="15" y="185" fill="#0D9488" font-family="sans-serif" font-size="11" font-weight="bold">Engine: Gemini 2.5 Pro</text>
    <text x="15" y="210" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] 100% Fact Verified</text>
  </g>

