    <text x="15" y="90" fill="#334155" font-family="sans-serif" font-size="11">• Draw.io mxGraph XML Synthesis</text>
    <text x="15" y="115" fill="#334155" font-family="sans-serif" font-size="11">• 2D Collision Auto-Healing Engine</text>
    <text x="15" y="140" fill="#334155" font-family="sans-serif" font-size="11">• Standalone SVG/PNG Exporter</text>
