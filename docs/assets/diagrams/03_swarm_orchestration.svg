    <text x="15" y="65" fill="#334155" font-family="sans-serif" font-size="11">• Persona style memory alignment</text>
    <text x="15" y="90" fill="#334155" font-family="sans-serif" font-size="11">• Omnichannel hook &amp; CTA writing</text>
    <text x="15" y="115" fill="#334155" font-family="sans-serif" font-size="11">• Cliché &amp; buzzword filtering</text>
    <text x="15" y="140" fill="#334155" font-family="sans-serif" font-size="11">• Multi-chapter scene breakdowns</text>
    <line x1="15" y1="160" x2="275" y2="160" stroke="#E2E8F0"/>
    <text x="15" y="185" fill="#4F46E5" font-family="sans-serif" font-size="11" font-weight="bold">Engine: Claude 3.5 Sonnet</text>
    <text x="15" y="210" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] Tone Alignment 94%</text>
  </g>

  <!-- Agent 3: Visual & Voice -->
  <g transform="translate(710, 375)">
    <rect width="290" height="230" rx="10" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5" filter="url(#cardShadow3)"/>
    <rect width="290" height="38" rx="10" fill="#FDF2F8"/>
