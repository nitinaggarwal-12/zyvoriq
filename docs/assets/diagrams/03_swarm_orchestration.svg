  <g transform="translate(420, 235)">
    <rect width="600" height="85" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#cardShadow3)"/>
    <text x="25" y="32" fill="#3730A3" font-family="sans-serif" font-size="16" font-weight="bold">Director Swarm Orchestrator (DAG Engine)</text>
    <text x="25" y="55" fill="#4338CA" font-family="sans-serif" font-size="12">Decomposes Concept into Asynchronous Sub-Tasks across 4 Specialized Workers</text>
    <text x="25" y="73" fill="#15803D" font-family="sans-serif" font-size="11" font-weight="bold">[PASS] Live SSE Stream Active</text>
