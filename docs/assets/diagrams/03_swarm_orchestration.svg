  <line x1="190" y1="355" x2="1250" y2="355" stroke="#4F46E5" stroke-width="2"/>

  <!-- Agent 1: Research -->
  <g transform="translate(50, 375)">
    <rect width="290" height="230" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#cardShadow3)"/>
    <rect width="290" height="38" rx="10" fill="#CCFBF1"/>
    <text x="15" y="25" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">1. Research &amp; Grounding</text>
    <text x="15" y="65" fill="#334155" font-family="sans-serif" font-size="11">• Google Search Grounding API</text>
