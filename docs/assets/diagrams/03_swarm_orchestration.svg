    <text x="15" y="115" fill="#334155" font-family="sans-serif" font-size="11">• PDF &amp; Document chunking</text>
    <text x="15" y="140" fill="#334155" font-family="sans-serif" font-size="11">• Citation anchoring (URLs/DOIs)</text>
