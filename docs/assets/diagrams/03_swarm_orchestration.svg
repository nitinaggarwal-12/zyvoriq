  <g transform="translate(320, 805)">
    <rect width="800" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="30" y="35" fill="#166534" font-family="sans-serif" font-size="14" font-weight="bold">Deployed Omnichannel Deliverables: YouTube 4K | LinkedIn Carousels | X Threads | Substack</text>
