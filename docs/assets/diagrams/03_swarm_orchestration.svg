    <text x="15" y="115" fill="#334155" font-family="sans-serif" font-size="11">• DeepMind Neural TTS Dubbing</text>
    <text x="15" y="140" fill="#334155" font-family="sans-serif" font-size="11">• Gold Karaoke Subtitle Sync</text>
