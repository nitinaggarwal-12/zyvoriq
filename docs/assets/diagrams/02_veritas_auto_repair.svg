  <rect x="1305" y="32" width="145" height="32" rx="16" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="1.2"/>
  <text x="1325" y="53" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold">Self-Healing Loop</text>

