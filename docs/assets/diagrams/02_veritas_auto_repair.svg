<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="100%" height="100%">
  <defs>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrTeal2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#0D9488"/></marker>
    <marker id="arrGreen2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#16A34A"/></marker>
    <marker id="arrRed2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#DC2626"/></marker>
  </defs>

  <rect width="1500" height="950" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1498" height="948" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header -->
  <text x="50" y="52" fill="#0F172A" font-family="sans-serif" font-size="26" font-weight="bold" letter-spacing="-0.5px">AI-003: Veritas 5-Axis Deterministic Quality Consensus &amp; Closed-Loop Auto-Repair</text>
  <text x="50" y="78" fill="#475569" font-family="sans-serif" font-size="14" font-weight="500">Autonomous Content Quality Governance: Multi-Engine LLM Consensus + Automated Defect Diff Extraction + 3-Loop Self-Repair</text>

  <rect x="1150" y="32" width="140" height="32" rx="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.2"/>
  <text x="1170" y="53" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">VQS Formula</text>
  <rect x="1305" y="32" width="145" height="32" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="1325" y="53" fill="#15803D" font-family="sans-serif" font-size="13" font-weight="bold">Self-Healing Loop</text>

  <!-- Flow Ribbon -->
  <rect x="50" y="105" width="1400" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow2)"/>
  <g transform="translate(70, 118)">
    <text x="0" y="24" fill="#0284C7" font-family="sans-serif" font-size="12" font-weight="bold">LIFECYCLE:</text>
    <rect x="90" y="4" width="200" height="28" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="110" y="23" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="bold">1. Media Draft Ingestion</text>
    <path d="M300 18 L325 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="335" y="4" width="220" height="28" rx="6" fill="#CCFBF1" stroke="#0D9488"/>
    <text x="350" y="23" fill="#0F766E" font-family="sans-serif" font-size="11" font-weight="bold">2. 5-Axis Multi-Model Eval</text>
    <path d="M565 18 L590 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="600" y="4" width="220" height="28" rx="6" fill="#FEF3C7" stroke="#D97706"/>
    <text x="615" y="23" fill="#92400E" font-family="sans-serif" font-size="11" font-weight="bold">3. VQS Gate Decision (90)</text>
    <path d="M830 18 L855 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="865" y="4" width="240" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626"/>
    <text x="880" y="23" fill="#991B1B" font-family="sans-serif" font-size="11" font-weight="bold">4. Surgical Defect Diff Loop</text>
    <path d="M1115 18 L1140 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrGreen2)"/>

    <rect x="1150" y="4" width="200" height="28" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="1170" y="23" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">5. C2PA Signed Certificate</text>
  </g>

  <!-- SWIMLANE 1: 5 EVALUATION AXES -->
  <g transform="translate(50, 185)">
    <rect width="450" height="720" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow2)"/>
    <rect width="450" height="42" rx="14" fill="#CCFBF1"/>
    <text x="20" y="27" fill="#0F766E" font-family="sans-serif" font-size="14" font-weight="bold">SECTION 1: THE 5 VERITAS EVALUATION AXES</text>

    <!-- 5 Cards Stacked -->
    <!-- Axis 1 -->
    <g transform="translate(18, 55)">
      <rect width="414" height="110" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#CCFBF1" stroke="#0D9488"/>
      <polygon points="26,16 32,24 27,24 29,34 20,27 25,27" fill="#0D9488"/>
      <text x="48" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">1. Factuality &amp; Grounding (Weight: 30%)</text>
      <text x="48" y="44" fill="#0F766E" font-family="sans-serif" font-size="11">Google Search Grounding &amp; Enterprise Corpus</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="#E2E8F0"/>
      <text x="16" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Claim-by-claim ground truth validation</text>
      <text x="16" y="95" fill="#334155" font-family="sans-serif" font-size="11">• Penalty: -25 unverified claim; -100 catastrophic error</text>
    </g>

    <!-- Axis 2 -->
    <g transform="translate(18, 175)">
      <rect width="414" height="110" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#EEF2FF" stroke="#6366F1"/>
      <circle cx="26" cy="26" r="7" fill="#6366F1"/>
      <text x="48" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">2. Brand Voice Alignment (Weight: 25%)</text>
      <text x="48" y="44" fill="#4338CA" font-family="sans-serif" font-size="11">Persona Memory Vector Cosine Similarity</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="#E2E8F0"/>
      <text x="16" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Cosine distance to brand tone vector in pgvector</text>
      <text x="16" y="95" fill="#334155" font-family="sans-serif" font-size="11">• Cliché filter: "delve", "tapestry", "game-changer"</text>
    </g>

    <!-- Axis 3 -->
    <g transform="translate(18, 295)">
      <rect width="414" height="110" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#E0F2FE" stroke="#0284C7"/>
      <rect x="20" y="20" width="12" height="12" rx="2" fill="#0284C7"/>
      <text x="48" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">3. Multi-Engine Consensus (Weight: 20%)</text>
      <text x="48" y="44" fill="#0369A1" font-family="sans-serif" font-size="11">Dual Model Evaluation (Gemini 2.5 Pro + Claude 3.5)</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="#E2E8F0"/>
      <text x="16" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Independent claim cross-examination</text>
      <text x="16" y="95" fill="#334155" font-family="sans-serif" font-size="11">• High semantic divergence triggers human review</text>
    </g>

    <!-- Axis 4 -->
    <g transform="translate(18, 415)">
      <rect width="414" height="120" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8" filter="url(#cardShadow2)"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#FEE2E2" stroke="#DC2626"/>
      <path d="M26,18 L32,22 L32,28 C32,32 26,34 26,34 C26,34 20,32 20,28 L20,22 Z" fill="#DC2626"/>
      <text x="48" y="28" fill="#991B1B" font-family="sans-serif" font-size="13" font-weight="bold">4. Safety, Policy &amp; IP (Weight: 15% - HARD GATE)</text>
      <text x="48" y="44" fill="#B91C1C" font-family="sans-serif" font-size="11">PII Leakage, Toxic Content &amp; IP Infringement</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="#FECACA"/>
      <text x="16" y="75" fill="#7F1D1D" font-family="sans-serif" font-size="11">• Zero tolerance: Score must be exactly 100/100</text>
      <text x="16" y="95" fill="#7F1D1D" font-family="sans-serif" font-size="11">• Automated PII masking &amp; defamatory libel detection</text>
      <text x="16" y="112" fill="#DC2626" font-family="sans-serif" font-size="10" font-weight="bold">[HARD GATE] Any violation immediately vetoes publish</text>
    </g>

    <!-- Axis 5 -->
    <g transform="translate(18, 545)">
      <rect width="414" height="110" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
      <circle cx="26" cy="26" r="7" fill="#16A34A"/>
      <text x="48" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">5. Perceptual Humanization (Weight: 10%)</text>
      <text x="48" y="44" fill="#15803D" font-family="sans-serif" font-size="11">Burstiness, Rhythm &amp; Vocal Flow Dynamics</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="#E2E8F0"/>
      <text x="16" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Syntactic variance prevents repetitive cadence</text>
      <text x="16" y="95" fill="#334155" font-family="sans-serif" font-size="11">• Neural audio breath &amp; pitch modulation check</text>
    </g>

    <!-- Formula Footer Box -->
    <g transform="translate(18, 665)">
      <rect width="414" height="40" rx="6" fill="#FFFFFF" stroke="#0D9488"/>
      <text x="15" y="25" fill="#0369A1" font-family="sans-serif" font-size="12" font-weight="bold">VQS = 0.30(Fact) + 0.25(Tone) + 0.20(Cons) + 0.15(Safe) + 0.10(Hum)</text>
    </g>
