        <rect width="380" height="150" rx="6" fill="#0D1322" stroke="#F59E0B"/>
        <text x="15" y="25" fill="#FCD34D" font-family="sans-serif" font-size="12" font-weight="bold">Step 3: Re-Evaluation &amp; Convergence</text>
        <text x="15" y="45" fill="#94A3B8" font-family="sans-serif" font-size="10">• Re-calculates 5-Axis VQS on newly patched draft</text>
        <text x="15" y="65" fill="#94A3B8" font-family="sans-serif" font-size="10">• Loop count &lt;= 3: If VQS &gt;= 90 -> Issue Certificate</text>
        <text x="15" y="85" fill="#94A3B8" font-family="sans-serif" font-size="10">• Loop count > 3: Gracefully escalate to human co-pilot</text>
        <text x="15" y="110" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">[CONVERGENCE] 91.2% repaired on Loop 1; 98.6% by Loop 2</text>
