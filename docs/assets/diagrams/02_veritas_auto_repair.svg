        <text x="20" y="135" fill="#E2E8F0" font-family="monospace" font-size="11">  "safety_policy_passed": true,</text>
        <text x="20" y="155" fill="#E2E8F0" font-family="monospace" font-size="11">  "humanization_score": 91.0,</text>
        <text x="20" y="180" fill="#A5B4FC" font-family="monospace" font-size="11">  "evaluators": ["gemini-2.5-pro", "claude-3.5"],</text>
        <text x="20" y="205" fill="#FCD34D" font-family="monospace" font-size="11">  "c2pa_manifest_hash": "sha256:e3b0c44...",</text>
        <text x="20" y="230" fill="#34D399" font-family="monospace" font-size="11">  "signed_by": "Zyvoriq Veritas Enclave",</text>
        <text x="20" y="255" fill="#34D399" font-family="monospace" font-size="11">  "signature": "MEQCIFz9...ed25519"</text>
        <text x="20" y="280" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">}</text>

        <line x1="20" y1="305" x2="370" y2="305" stroke="rgba(255,255,255,0.1)"/>
        <text x="20" y="330" fill="#2DD4BF" font-family="sans-serif" font-size="12" font-weight="bold">✓ C2PA Content Credentials Embedded in MP4/WAV</text>
        <text x="20" y="355" fill="#A7F3D0" font-family="sans-serif" font-size="11">Immutable audit verification logged to PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 918)">
    <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="bold">LEGEND:</text>
    <rect x="70" y="5" width="14" height="14" rx="3" fill="#14B8A6"/>
    <text x="92" y="17" fill="#94A3B8" font-family="sans-serif" font-size="12">5-Axis Quality Metrics</text>
    <rect x="250" y="5" width="14" height="14" rx="3" fill="#F43F5E"/>
    <text x="272" y="17" fill="#94A3B8" font-family="sans-serif" font-size="12">Auto-Repair Feedback Loop</text>
    <rect x="470" y="5" width="14" height="14" rx="3" fill="#10B981"/>
    <text x="492" y="17" fill="#94A3B8" font-family="sans-serif" font-size="12">Signed VQC Quality Certificate</text>
    <rect x="700" y="5" width="14" height="14" rx="3" fill="#F59E0B"/>
