        <text x="15" y="25" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Step 1: Surgical Defect Diffing</text>
        <text x="15" y="45" fill="#94A3B8" font-family="sans-serif" font-size="10">• Isolates exact failing sentences or scene frames</text>
        <text x="15" y="65" fill="#94A3B8" font-family="sans-serif" font-size="10">• Injects ground-truth verified correction context</text>
      </g>

      <line x1="205" y1="140" x2="205" y2="165" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrRed2)"/>

      <!-- Step B: Targeted Regenerator -->
      <g transform="translate(15, 170)">
        <rect width="380" height="90" rx="6" fill="#0D1322" stroke="#6366F1"/>
        <text x="15" y="25" fill="#A5B4FC" font-family="sans-serif" font-size="12" font-weight="bold">Step 2: Targeted Re-Prompting</text>
        <text x="15" y="45" fill="#94A3B8" font-family="sans-serif" font-size="10">• Dispatches patch prompt to LLM with error rationale</text>
        <text x="15" y="65" fill="#94A3B8" font-family="sans-serif" font-size="10">• Preserves verified sections (Zero wasteful re-runs)</text>
      </g>

      <line x1="205" y1="265" x2="205" y2="290" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrRed2)"/>

      <!-- Step C: Loop Counter & Escalate -->
