      <text x="16" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Independent claim cross-examination</text>
      <text x="16" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="11">• High semantic divergence triggers human review</text>
