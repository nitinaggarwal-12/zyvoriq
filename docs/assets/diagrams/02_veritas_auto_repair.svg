        <text x="20" y="30" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">{ "certificate_id": "vqc_89f3a12",</text>
        <text x="20" y="55" fill="#E2E8F0" font-family="monospace" font-size="11">  "composite_vqs": 94.6,</text>
        <text x="20" y="75" fill="#E2E8F0" font-family="monospace" font-size="11">  "factuality_score": 96.0,</text>
        <text x="20" y="95" fill="#E2E8F0" font-family="monospace" font-size="11">  "brand_tone_alignment": 92.5,</text>
