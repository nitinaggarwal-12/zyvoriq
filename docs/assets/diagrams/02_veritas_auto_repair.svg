        <text x="575" y="48" fill="#FFE4E6" font-family="sans-serif" font-size="11">• Trigger Auto-Repair Engine</text>
        <text x="575" y="68" fill="#F43F5E" font-family="sans-serif" font-size="10" font-weight="bold">[REPAIR] Targeted Patch Generator</text>
      </g>
    </g>

