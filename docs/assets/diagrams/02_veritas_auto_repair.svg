  <!-- SWIMLANE 1: 5 EVALUATION AXES -->
  <g transform="translate(50, 185)">
    <rect width="450" height="720" rx="14" fill="#0B101D" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect width="450" height="42" rx="14" fill="#151E33"/>
    <text x="20" y="27" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">SECTION 1: THE 5 VERITAS EVALUATION AXES</text>

    <!-- 5 Cards Stacked -->
    <!-- Axis 1 -->
    <g transform="translate(18, 55)">
      <rect width="414" height="110" rx="8" fill="url(#cardGrad2)" stroke="#14B8A6" stroke-width="1.5"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(20,184,166,0.2)" stroke="#14B8A6"/>
      <polygon points="26,16 32,24 27,24 29,34 20,27 25,27" fill="#14B8A6"/>
      <text x="48" y="28" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">1. Factuality &amp; Grounding (Weight: 30%)</text>
      <text x="48" y="44" fill="#2DD4BF" font-family="sans-serif" font-size="11">Google Search Grounding &amp; Enterprise Corpus</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Claim-by-claim ground truth validation</text>
      <text x="16" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Penalty: -25 unverified claim; -100 catastrophic error</text>
    </g>

    <!-- Axis 2 -->
    <g transform="translate(18, 175)">
      <rect width="414" height="110" rx="8" fill="url(#cardGrad2)" stroke="#6366F1" stroke-width="1.5"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(99,102,241,0.2)" stroke="#6366F1"/>
      <circle cx="26" cy="26" r="7" fill="#6366F1"/>
      <text x="48" y="28" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">2. Brand Voice Alignment (Weight: 25%)</text>
      <text x="48" y="44" fill="#A5B4FC" font-family="sans-serif" font-size="11">Persona Memory Vector Cosine Similarity</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Cosine distance to brand tone vector in pgvector</text>
      <text x="16" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Cliché filter: "delve", "tapestry", "game-changer"</text>
    </g>

    <!-- Axis 3 -->
    <g transform="translate(18, 295)">
      <rect width="414" height="110" rx="8" fill="url(#cardGrad2)" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(56,189,248,0.2)" stroke="#38BDF8"/>
