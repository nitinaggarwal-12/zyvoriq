      <g transform="translate(15, 50)">
        <rect width="390" height="385" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
        <text x="20" y="30" fill="#0369A1" font-family="monospace" font-size="12" font-weight="bold">{ "certificate_id": "vqc_89f3a12",</text>
        <text x="20" y="55" fill="#334155" font-family="monospace" font-size="11">  "composite_vqs": 94.6,</text>
        <text x="20" y="75" fill="#334155" font-family="monospace" font-size="11">  "factuality_score": 96.0,</text>
        <text x="20" y="95" fill="#334155" font-family="monospace" font-size="11">  "brand_tone_alignment": 92.5,</text>
        <text x="20" y="115" fill="#334155" font-family="monospace" font-size="11">  "consensus_agreement": 95.0,</text>
        <text x="20" y="135" fill="#334155" font-family="monospace" font-size="11">  "safety_policy_passed": true,</text>
        <text x="20" y="155" fill="#334155" font-family="monospace" font-size="11">  "humanization_score": 91.0,</text>
        <text x="20" y="180" fill="#4338CA" font-family="monospace" font-size="11">  "evaluators": ["gemini-2.5-pro", "claude-3.5"],</text>
        <text x="20" y="205" fill="#B45309" font-family="monospace" font-size="11">  "c2pa_manifest_hash": "sha256:e3b0c44...",</text>
        <text x="20" y="230" fill="#15803D" font-family="monospace" font-size="11">  "signed_by": "Zyvoriq Veritas Enclave",</text>
        <text x="20" y="255" fill="#15803D" font-family="monospace" font-size="11">  "signature": "MEQCIFz9...ed25519"</text>
        <text x="20" y="280" fill="#0369A1" font-family="monospace" font-size="12" font-weight="bold">}</text>

        <line x1="20" y1="305" x2="370" y2="305" stroke="#E2E8F0"/>
        <text x="20" y="330" fill="#0F766E" font-family="sans-serif" font-size="12" font-weight="bold">✓ C2PA Content Credentials Embedded in MP4/WAV</text>
        <text x="20" y="355" fill="#15803D" font-family="sans-serif" font-size="11">Immutable audit verification logged to PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 918)">
    <text x="0" y="18" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">LEGEND:</text>
    <rect x="70" y="5" width="14" height="14" rx="3" fill="#0D9488"/>
    <text x="92" y="17" fill="#334155" font-family="sans-serif" font-size="12">5-Axis Quality Metrics</text>
    <rect x="250" y="5" width="14" height="14" rx="3" fill="#DC2626"/>
    <text x="272" y="17" fill="#334155" font-family="sans-serif" font-size="12">Auto-Repair Feedback Loop</text>
    <rect x="470" y="5" width="14" height="14" rx="3" fill="#16A34A"/>
    <text x="492" y="17" fill="#334155" font-family="sans-serif" font-size="12">Signed VQC Quality Certificate</text>
    <rect x="700" y="5" width="14" height="14" rx="3" fill="#D97706"/>
    <text x="722" y="17" fill="#334155" font-family="sans-serif" font-size="12">Co-Pilot Review Gate</text>
