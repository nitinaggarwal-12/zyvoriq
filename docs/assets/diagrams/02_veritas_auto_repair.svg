    <!-- Axis 4 -->
    <g transform="translate(18, 415)">
      <rect width="414" height="120" rx="8" fill="#2A0B12" stroke="#F43F5E" stroke-width="1.8"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(244,63,94,0.2)" stroke="#F43F5E"/>
      <path d="M26,18 L32,22 L32,28 C32,32 26,34 26,34 C26,34 20,32 20,28 L20,22 Z" fill="#F43F5E"/>
      <text x="48" y="28" fill="#FECDD3" font-family="sans-serif" font-size="13" font-weight="bold">4. Safety, Policy &amp; IP (Weight: 15% - HARD GATE)</text>
