    <rect x="90" y="4" width="200" height="28" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="110" y="23" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">1. Media Draft Ingestion</text>
    <path d="M300 18 L325 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="335" y="4" width="220" height="28" rx="6" fill="#1E293B" stroke="#14B8A6"/>
    <text x="350" y="23" fill="#2DD4BF" font-family="sans-serif" font-size="11" font-weight="bold">2. 5-Axis Multi-Model Eval</text>
    <path d="M565 18 L590 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="600" y="4" width="220" height="28" rx="6" fill="#1E293B" stroke="#F59E0B"/>
    <text x="615" y="23" fill="#FCD34D" font-family="sans-serif" font-size="11" font-weight="bold">3. VQS Gate Decision (90)</text>
    <path d="M830 18 L855 18" stroke="#64748B" stroke-width="2" marker-end="url(#arrTeal2)"/>

    <rect x="865" y="4" width="240" height="28" rx="6" fill="#1E293B" stroke="#F43F5E"/>
    <text x="880" y="23" fill="#FDA4AF" font-family="sans-serif" font-size="11" font-weight="bold">4. Surgical Defect Diff Loop</text>
