        <text x="285" y="28" fill="#FCD34D" font-family="sans-serif" font-size="13" font-weight="bold">75 &lt;= VQS &lt; 90</text>
        <text x="285" y="48" fill="#FEF08A" font-family="sans-serif" font-size="11">• Co-Pilot Review Required</text>
        <text x="285" y="68" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold">[REVIEW] Human Approval Gate</text>

        <!-- Red Gate -->
