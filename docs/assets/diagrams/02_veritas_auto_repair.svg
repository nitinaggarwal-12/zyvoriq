      <line x1="12" y1="56" x2="402" y2="56" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="75" fill="#FFE4E6" font-family="sans-serif" font-size="11">• Zero tolerance: Score must be exactly 100/100</text>
      <text x="16" y="95" fill="#FFE4E6" font-family="sans-serif" font-size="11">• Automated PII masking &amp; defamatory libel detection</text>
      <text x="16" y="112" fill="#F43F5E" font-family="sans-serif" font-size="10" font-weight="bold">[HARD GATE] Any violation immediately vetoes publish</text>
