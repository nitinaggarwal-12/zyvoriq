        <text x="15" y="48" fill="#15803D" font-family="sans-serif" font-size="11">• Instant Publish Approved</text>
        <text x="15" y="68" fill="#166534" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] Automatic Channel Dispatch</text>

        <!-- Amber Gate -->
        <rect x="270" y="0" width="270" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
        <text x="285" y="28" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">75 &lt;= VQS &lt; 90</text>
        <text x="285" y="48" fill="#B45309" font-family="sans-serif" font-size="11">• Co-Pilot Review Required</text>
        <text x="285" y="68" fill="#92400E" font-family="sans-serif" font-size="10" font-weight="bold">[REVIEW] Human Approval Gate</text>

        <!-- Red Gate -->
        <rect x="560" y="0" width="270" height="80" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
        <text x="575" y="28" fill="#991B1B" font-family="sans-serif" font-size="13" font-weight="bold">VQS &lt; 75 || Single Dim &lt; 70</text>
        <text x="575" y="48" fill="#B91C1C" font-family="sans-serif" font-size="11">• Trigger Auto-Repair Engine</text>
        <text x="575" y="68" fill="#7F1D1D" font-family="sans-serif" font-size="10" font-weight="bold">[REPAIR] Targeted Patch Generator</text>
      </g>
    </g>

    <!-- Lower Flow: Auto-Repair Circuit (Left) vs Provenance Certificate (Right) -->
    <g transform="translate(30, 235)">
      <!-- Left Box: Auto-Repair Engine -->
      <rect width="410" height="460" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" filter="url(#cardShadow2)"/>
      <text x="20" y="30" fill="#991B1B" font-family="sans-serif" font-size="14" font-weight="bold">Closed-Loop Auto-Repair Engine</text>

      <!-- Step A: Defect Diff -->
      <g transform="translate(15, 45)">
        <rect width="380" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="15" y="25" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold">Step 1: Surgical Defect Diffing</text>
        <text x="15" y="45" fill="#475569" font-family="sans-serif" font-size="10">• Isolates exact failing sentences or scene frames</text>
        <text x="15" y="65" fill="#475569" font-family="sans-serif" font-size="10">• Injects ground-truth verified correction context</text>
      </g>

      <line x1="205" y1="140" x2="205" y2="165" stroke="#DC2626" stroke-width="2" marker-end="url(#arrRed2)"/>

      <!-- Step B: Targeted Regenerator -->
      <g transform="translate(15, 170)">
        <rect width="380" height="90" rx="6" fill="#F8FAFC" stroke="#818CF8"/>
        <text x="15" y="25" fill="#3730A3" font-family="sans-serif" font-size="12" font-weight="bold">Step 2: Targeted Re-Prompting</text>
        <text x="15" y="45" fill="#475569" font-family="sans-serif" font-size="10">• Dispatches patch prompt to LLM with error rationale</text>
        <text x="15" y="65" fill="#475569" font-family="sans-serif" font-size="10">• Preserves verified sections (Zero wasteful re-runs)</text>
      </g>

      <line x1="205" y1="265" x2="205" y2="290" stroke="#DC2626" stroke-width="2" marker-end="url(#arrRed2)"/>

      <!-- Step C: Loop Counter & Escalate -->
      <g transform="translate(15, 295)">
        <rect width="380" height="150" rx="6" fill="#FFFBEB" stroke="#D97706"/>
        <text x="15" y="25" fill="#92400E" font-family="sans-serif" font-size="12" font-weight="bold">Step 3: Re-Evaluation &amp; Convergence</text>
        <text x="15" y="45" fill="#475569" font-family="sans-serif" font-size="10">• Re-calculates 5-Axis VQS on newly patched draft</text>
        <text x="15" y="65" fill="#475569" font-family="sans-serif" font-size="10">• Loop count &lt;= 3: If VQS &gt;= 90 -> Issue Certificate</text>
        <text x="15" y="85" fill="#475569" font-family="sans-serif" font-size="10">• Loop count > 3: Gracefully escalate to human co-pilot</text>
        <text x="15" y="110" fill="#166534" font-family="sans-serif" font-size="10" font-weight="bold">[CONVERGENCE] 91.2% repaired on Loop 1; 98.6% by Loop 2</text>
      </g>
    </g>

