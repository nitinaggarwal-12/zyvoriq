  <!-- Inter-Lane Arrow -->
  <path d="M 500 545 L 540 545" stroke="#0D9488" stroke-width="3" marker-end="url(#arrTeal2)"/>

  <!-- SWIMLANE 2: CLOSED-LOOP AUTO-REPAIR ENGINE -->
