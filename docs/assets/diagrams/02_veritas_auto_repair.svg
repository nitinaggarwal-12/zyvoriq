      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10B981"/>
      <circle cx="26" cy="26" r="7" fill="#10B981"/>
      <text x="48" y="28" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">5. Perceptual Humanization (Weight: 10%)</text>
      <text x="48" y="44" fill="#34D399" font-family="sans-serif" font-size="11">Burstiness, Rhythm &amp; Vocal Flow Dynamics</text>
      <line x1="12" y1="56" x2="402" y2="56" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="75" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Syntactic variance prevents repetitive cadence</text>
      <text x="16" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="11">• Neural audio breath &amp; pitch modulation check</text>
