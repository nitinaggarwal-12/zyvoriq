  <text x="50" y="78" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="500">Autonomous Content Quality Governance: Multi-Engine LLM Consensus + Automated Defect Diff Extraction + 3-Loop Self-Repair</text>

  <rect x="1150" y="32" width="140" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="#14B8A6" stroke-width="1.2"/>
