<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <rect width="1200" height="650" fill="#07090E" rx="16"/>
  <rect x="1" y="1" width="1198" height="648" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="15"/>

  <text x="50" y="55" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="bold">UX-001: Platform Information Architecture &amp; Route Tree</text>
  <rect x="970" y="35" width="180" height="28" rx="14" fill="rgba(34,211,238,0.15)" stroke="#22D3EE" stroke-width="1"/>
  <text x="990" y="54" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">Information Architecture</text>

  <!-- Root -->
  <rect x="475" y="100" width="250" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="540" y="130" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">/ (Landing &amp; Demo)</text>

  <line x1="600" y1="150" x2="600" y2="200" stroke="#64748B" stroke-width="2"/>
  <line x1="150" y1="200" x2="1050" y2="200" stroke="#64748B" stroke-width="2"/>

  <!-- Route 1: Dashboard -->
  <rect x="70" y="230" width="180" height="70" rx="8" fill="#151D2F" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="90" y="260" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">/app/dashboard</text>
  <text x="90" y="282" fill="#94A3B8" font-family="sans-serif" font-size="11">KPIs &amp; Active Projects</text>

  <!-- Route 2: Director -->
  <rect x="290" y="230" width="180" height="70" rx="8" fill="#151D2F" stroke="#6366F1" stroke-width="1.5"/>
  <text x="310" y="260" fill="#A5B4FC" font-family="sans-serif" font-size="14" font-weight="bold">/app/director</text>
  <text x="310" y="282" fill="#94A3B8" font-family="sans-serif" font-size="11">Live Swarm Console</text>

  <!-- Route 3: Studio -->
  <rect x="510" y="230" width="180" height="70" rx="8" fill="#151D2F" stroke="#EC4899" stroke-width="1.5"/>
  <text x="530" y="260" fill="#F472B6" font-family="sans-serif" font-size="14" font-weight="bold">/app/studio</text>
  <text x="530" y="282" fill="#94A3B8" font-family="sans-serif" font-size="11">Video, Audio, Code</text>

  <!-- Route 4: Veritas -->
  <rect x="730" y="230" width="180" height="70" rx="8" fill="#151D2F" stroke="#10B981" stroke-width="1.5"/>
  <text x="750" y="260" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="bold">/app/veritas</text>
  <text x="750" y="282" fill="#94A3B8" font-family="sans-serif" font-size="11">Quality &amp; Auto-Repair</text>

  <!-- Route 5: Governance -->
  <rect x="950" y="230" width="180" height="70" rx="8" fill="#151D2F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="965" y="260" fill="#FCD34D" font-family="sans-serif" font-size="14" font-weight="bold">/app/governance</text>
  <text x="965" y="282" fill="#94A3B8" font-family="sans-serif" font-size="11">Autonomy &amp; C2PA Logs</text>

  <!-- Sub-routes for Studio -->
  <line x1="600" y1="300" x2="600" y2="360" stroke="#EC4899" stroke-width="1.5"/>
  
  <rect x="350" y="360" width="500" height="220" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="370" y="395" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Studio Sub-Modality Workspaces</text>
  <text x="370" y="430" fill="#94A3B8" font-family="sans-serif" font-size="13">• <tspan fill="#38BDF8">/studio/video</tspan> — Cinematic Storyboards &amp; 9:16 Shorts</text>
  <text x="370" y="465" fill="#94A3B8" font-family="sans-serif" font-size="13">• <tspan fill="#38BDF8">/studio/audio</tspan> — 5-Band Neural Dubbing in 30+ Languages</text>
  <text x="370" y="500" fill="#94A3B8" font-family="sans-serif" font-size="13">• <tspan fill="#38BDF8">/studio/code</tspan> — AST Validator &amp; Interactive Vector Diagrams</text>
  <text x="370" y="535" fill="#94A3B8" font-family="sans-serif" font-size="13">• <tspan fill="#38BDF8">/studio/editorial</tspan> — Omnichannel Substack / LinkedIn Copy</text>
</svg>