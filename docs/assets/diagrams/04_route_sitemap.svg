<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" width="100%" height="100%">
  <defs>
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1440" height="850" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1438" height="848" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="50" y="52" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold">UX-001: Platform Information Architecture &amp; Route Hierarchy</text>
  <text x="50" y="78" fill="#475569" font-family="sans-serif" font-size="13">Complete Next.js App Router Structure across Marketing, Authenticated Workspaces &amp; Modality Tools</text>

  <!-- Root -->
  <g transform="translate(570, 110)">
    <rect width="300" height="60" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#cardShadow4)"/>
    <text x="35" y="35" fill="#0369A1" font-family="sans-serif" font-size="15" font-weight="bold">/ (Landing Page &amp; Demo)</text>
  </g>

  <line x1="720" y1="170" x2="720" y2="220" stroke="#64748B" stroke-width="2"/>
  <line x1="140" y1="220" x2="1300" y2="220" stroke="#64748B" stroke-width="2"/>

  <!-- Route 1: Dashboard -->
  <g transform="translate(40, 245)">
    <rect width="230" height="90" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="230" height="30" rx="8" fill="#CCFBF1"/>
    <text x="15" y="20" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">/app/dashboard</text>
    <text x="15" y="52" fill="#334155" font-family="sans-serif" font-size="11">Executive Overview</text>
    <text x="15" y="72" fill="#475569" font-family="sans-serif" font-size="10">Active Projects &amp; Spend Quotas</text>
  </g>

  <!-- Route 2: Director -->
  <g transform="translate(300, 245)">
    <rect width="230" height="90" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="230" height="30" rx="8" fill="#EEF2FF"/>
    <text x="15" y="20" fill="#4338CA" font-family="sans-serif" font-size="13" font-weight="bold">/app/director</text>
    <text x="15" y="52" fill="#334155" font-family="sans-serif" font-size="11">Swarm Console</text>
    <text x="15" y="72" fill="#475569" font-family="sans-serif" font-size="10">Live Multi-Agent Stream</text>
  </g>

  <!-- Route 3: Studio -->
  <g transform="translate(560, 245)">
    <rect width="230" height="90" rx="8" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="230" height="30" rx="8" fill="#FDF2F8"/>
    <text x="15" y="20" fill="#9D174D" font-family="sans-serif" font-size="13" font-weight="bold">/app/studio</text>
    <text x="15" y="52" fill="#334155" font-family="sans-serif" font-size="11">Multimodal Studio</text>
    <text x="15" y="72" fill="#475569" font-family="sans-serif" font-size="10">Video, Audio, Code, Copy</text>
  </g>

  <!-- Route 4: Veritas -->
  <g transform="translate(820, 245)">
    <rect width="230" height="90" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="230" height="30" rx="8" fill="#DCFCE7"/>
    <text x="15" y="20" fill="#166534" font-family="sans-serif" font-size="13" font-weight="bold">/app/veritas</text>
    <text x="15" y="52" fill="#334155" font-family="sans-serif" font-size="11">Quality Center</text>
    <text x="15" y="72" fill="#475569" font-family="sans-serif" font-size="10">Factuality Diff &amp; Auto-Repair</text>
  </g>

  <!-- Route 5: Governance -->
  <g transform="translate(1080, 245)">
    <rect width="230" height="90" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="230" height="30" rx="8" fill="#FFFBEB"/>
    <text x="15" y="20" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">/app/governance</text>
    <text x="15" y="52" fill="#334155" font-family="sans-serif" font-size="11">Autonomy &amp; Compliance</text>
    <text x="15" y="72" fill="#475569" font-family="sans-serif" font-size="10">Policy Sliders &amp; C2PA Registry</text>
  </g>

  <!-- Studio Sub-Routes Details Box -->
  <line x1="675" y1="335" x2="675" y2="400" stroke="#DB2777" stroke-width="2"/>
  
  <g transform="translate(320, 400)">
    <rect width="710" height="380" rx="12" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5" filter="url(#cardShadow4)"/>
    <rect width="710" height="42" rx="12" fill="#FDF2F8"/>
    <text x="25" y="27" fill="#9D174D" font-family="sans-serif" font-size="15" font-weight="bold">Studio Nested Modality Workspaces</text>

    <g transform="translate(25, 60)">
      <rect width="660" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" fill="#0284C7" font-family="sans-serif" font-size="13" font-weight="bold">/studio/video/[assetId]</text>
      <text x="15" y="48" fill="#475569" font-family="sans-serif" font-size="11">1080p/4K Storyboards, Veo 2 Prompt Controls, 9:16 Social Shorts, Scene Pacing Canvas</text>

      <rect y="75" width="660" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="103" fill="#0D9488" font-family="sans-serif" font-size="13" font-weight="bold">/studio/audio/[assetId]</text>
      <text x="15" y="123" fill="#475569" font-family="sans-serif" font-size="11">5-Band Neural Voice Synthesizer, 30+ Multilingual Dubbing, Emotional Pitch &amp; Cadence Shaping</text>

      <rect y="150" width="660" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="178" fill="#D97706" font-family="sans-serif" font-size="13" font-weight="bold">/studio/code/[assetId]</text>
      <text x="15" y="198" fill="#475569" font-family="sans-serif" font-size="11">Babel AST Code Playground, Interactive Draw.io SVG Canvas, 2D Collision Auto-Healing</text>

      <rect y="225" width="660" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="253" fill="#6366F1" font-family="sans-serif" font-size="13" font-weight="bold">/studio/editorial/[assetId]</text>
      <text x="15" y="273" fill="#475569" font-family="sans-serif" font-size="11">Omnichannel Copy Matrix: LinkedIn Carousel Formatter, X Thread Generator, Substack Articles</text>
    </g>
