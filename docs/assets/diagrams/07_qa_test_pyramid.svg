<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <filter id="sh4" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#F8FAFC"/><rect x="1" y="1" width="1438" height="898" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <text x="50" y="52" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold">QAT-001: Comprehensive Quality Assurance &amp; Test Automation Pyramid</text>
  <text x="50" y="78" fill="#475569" font-family="sans-serif" font-size="13">Continuous Verification Architecture: Unit -> Integration -> Veritas AI Evals -> Cloudtop E2E Suites</text>

  <!-- Level 1: Cloudtop E2E (Top of Pyramid) -->
  <g transform="translate(420, 130)">
    <rect width="600" height="130" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh4)"/>
    <rect width="600" height="32" rx="10" fill="#FEE2E2"/><text x="20" y="22" fill="#991B1B" font-family="sans-serif" font-size="13" font-weight="bold">LEVEL 4: CLOUDTOP E2E BROWSER AUTOMATION (PUPPETEER)</text>
    <text x="20" y="55" fill="#334155" font-family="sans-serif" font-size="11">• Full user journey tests in dedicated Cloudtop headless Chromium runner</text>
    <text x="20" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Visual regression testing &amp; multi-viewport screenshots (390px, 834px, 1600px)</text>
    <text x="20" y="100" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] Cloudtop Verified (macOS Santa Protected)</text>
  </g>

  <!-- Level 2: Veritas AI Evals -->
  <g transform="translate(320, 280)">
    <rect width="800" height="140" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh4)"/>
    <rect width="800" height="32" rx="10" fill="#FEF3C7"/><text x="20" y="22" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">LEVEL 3: VERITAS 5-AXIS AI EVALUATION BENCHMARKS</text>
    <text x="20" y="55" fill="#334155" font-family="sans-serif" font-size="11">• 50 Reference architecture prompts tested against Gemini 2.5 Pro &amp; Claude 3.5 Sonnet</text>
    <text x="20" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Automated prompt regression, node collision healing, and hallucination scoring</text>
    <text x="20" y="100" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] VQS Benchmark: 96.2% Average Score</text>
  </g>

  <!-- Level 3: Integration & Contract -->
  <g transform="translate(220, 440)">
    <rect width="1000" height="150" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.8" filter="url(#sh4)"/>
    <rect width="1000" height="32" rx="10" fill="#EEF2FF"/><text x="20" y="22" fill="#4338CA" font-family="sans-serif" font-size="13" font-weight="bold">LEVEL 2: INTEGRATION &amp; API CONTRACT TESTS</text>
    <text x="20" y="55" fill="#334155" font-family="sans-serif" font-size="11">• PostgreSQL RLS tenant isolation tests with testcontainers</text>
    <text x="20" y="75" fill="#334155" font-family="sans-serif" font-size="11">• Redis BullMQ worker queue stress &amp; concurrency locking verification</text>
    <text x="20" y="95" fill="#334155" font-family="sans-serif" font-size="11">• Route Handler OpenAPI schema validation with Zod schemas</text>
    <text x="20" y="125" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] 100% Integration Pass Rate</text>
  </g>

  <!-- Level 4: Unit & Static Analysis (Base of Pyramid) -->
  <g transform="translate(120, 610)">
    <rect width="1200" height="160" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.8" filter="url(#sh4)"/>
    <rect width="1200" height="32" rx="10" fill="#CCFBF1"/><text x="20" y="22" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">LEVEL 1: UNIT TESTS &amp; STATIC APPLICATION SECURITY TESTING (SAST)</text>
    <text x="20" y="55" fill="#334155" font-family="sans-serif" font-size="11">• Vitest / Jest unit tests with 100% code coverage on core cryptographic and scoring algorithms</text>
    <text x="20" y="75" fill="#334155" font-family="sans-serif" font-size="11">• TypeScript strict type checking (npx tsc --noEmit) with zero any types</text>
    <text x="20" y="95" fill="#334155" font-family="sans-serif" font-size="11">• SAST static security scan: SVG XSS sanitization, secret scanner, and npm audit</text>
    <text x="20" y="125" fill="#15803D" font-family="sans-serif" font-size="10" font-weight="bold">[PASS] Zero Vulnerabilities / Zero Type Errors</text>
