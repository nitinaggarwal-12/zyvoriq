      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1440" height="800" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1438" height="798" fill="none" stroke="#E2E8F0" stroke-width="2"/>

