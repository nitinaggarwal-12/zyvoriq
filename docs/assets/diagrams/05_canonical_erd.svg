<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" width="100%" height="100%">
  <defs>
    <filter id="cardShadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1440" height="850" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1438" height="848" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <text x="50" y="52" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="bold">ARC-001 / DAT-001: Canonical Relational Entity-Relationship Model</text>
  <text x="50" y="78" fill="#475569" font-family="sans-serif" font-size="13">Multi-Tenant PostgreSQL 16 + pgvector Schema: Tenants -> Workspaces -> Projects -> Assets -> Artifacts -> Veritas</text>

  <!-- Tenant -->
  <g transform="translate(50, 120)">
    <rect width="250" height="150" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="250" height="34" rx="8" fill="#E2E8F0"/>
    <text x="15" y="23" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">TENANT (Billing Scope)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">name: string</text>
    <text x="15" y="95" fill="#475569" font-family="monospace" font-size="11">plan_tier: string</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">spending_limit_usd: float</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">created_at: timestamp</text>
  </g>

  <line x1="300" y1="195" x2="380" y2="195" stroke="#0284C7" stroke-width="2"/>

  <!-- Workspace -->
  <g transform="translate(380, 120)">
    <rect width="290" height="170" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="290" height="34" rx="8" fill="#CCFBF1"/>
    <text x="15" y="23" fill="#0F766E" font-family="sans-serif" font-size="13" font-weight="bold">WORKSPACE (Persona Vault)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">tenant_id: uuid (FK)</text>
    <text x="15" y="95" fill="#0D9488" font-family="monospace" font-size="11">persona_vector: vector(1536)</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">autonomy_mode: string</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">tone_blacklist: text[]</text>
    <text x="15" y="155" fill="#475569" font-family="monospace" font-size="11">gold_benchmark_id: uuid</text>
  </g>

  <line x1="670" y1="195" x2="750" y2="195" stroke="#0284C7" stroke-width="2"/>

  <!-- Project -->
  <g transform="translate(750, 120)">
    <rect width="260" height="150" rx="8" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="260" height="34" rx="8" fill="#EEF2FF"/>
    <text x="15" y="23" fill="#4338CA" font-family="sans-serif" font-size="13" font-weight="bold">PROJECT (Campaign)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">workspace_id: uuid (FK)</text>
    <text x="15" y="95" fill="#475569" font-family="monospace" font-size="11">title: string</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">status: string</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">created_at: timestamp</text>
  </g>

  <line x1="1010" y1="195" x2="1090" y2="195" stroke="#0284C7" stroke-width="2"/>

  <!-- Master Asset -->
  <g transform="translate(1090, 120)">
    <rect width="290" height="170" rx="8" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="290" height="34" rx="8" fill="#FDF2F8"/>
    <text x="15" y="23" fill="#9D174D" font-family="sans-serif" font-size="13" font-weight="bold">MASTER_ASSET (Concept)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">project_id: uuid (FK)</text>
    <text x="15" y="95" fill="#475569" font-family="monospace" font-size="11">raw_prompt: text</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">director_task_graph: jsonb</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">synthesis_status: string</text>
    <text x="15" y="155" fill="#475569" font-family="monospace" font-size="11">total_tokens_spent: int</text>
  </g>

  <!-- Modality Artifact -->
  <line x1="1235" y1="290" x2="1235" y2="390" stroke="#0284C7" stroke-width="2"/>
  
  <g transform="translate(1070, 390)">
    <rect width="320" height="190" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="320" height="34" rx="8" fill="#FFFBEB"/>
    <text x="15" y="23" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">MODALITY_ARTIFACT (Render)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">master_asset_id: uuid (FK)</text>
    <text x="15" y="95" fill="#D97706" font-family="monospace" font-size="11">modality: video|audio|code|text</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">media_s3_url: string</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">payload: jsonb</text>
    <text x="15" y="155" fill="#475569" font-family="monospace" font-size="11">c2pa_manifest_id: string</text>
    <text x="15" y="175" fill="#475569" font-family="monospace" font-size="11">created_at: timestamp</text>
  </g>

  <!-- Veritas Assessment -->
  <line x1="1070" y1="485" x2="890" y2="485" stroke="#16A34A" stroke-width="2"/>

  <g transform="translate(560, 390)">
    <rect width="330" height="210" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#cardShadow5)"/>
    <rect width="330" height="34" rx="8" fill="#DCFCE7"/>
    <text x="15" y="23" fill="#166534" font-family="sans-serif" font-size="13" font-weight="bold">VERITAS_ASSESSMENT (Gate QA)</text>
    <text x="15" y="55" fill="#334155" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#334155" font-family="monospace" font-size="11">artifact_id: uuid (FK)</text>
    <text x="15" y="95" fill="#166534" font-family="monospace" font-size="11">composite_vqs: float (0-100)</text>
    <text x="15" y="115" fill="#334155" font-family="monospace" font-size="11">factuality_score: float</text>
    <text x="15" y="135" fill="#334155" font-family="monospace" font-size="11">brand_tone_score: float</text>
    <text x="15" y="155" fill="#334155" font-family="monospace" font-size="11">gate_decision: PASS|REVIEW|REPAIR</text>
    <text x="15" y="175" fill="#334155" font-family="monospace" font-size="11">repair_loop_count: int</text>
    <text x="15" y="195" fill="#334155" font-family="monospace" font-size="11">ed25519_vqc_signature: text</text>
  </g>

  <!-- Publish Job -->
  <line x1="560" y1="485" x2="380" y2="485" stroke="#D97706" stroke-width="2"/>

  <g transform="translate(100, 410)">
    <rect width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#cardShadow5)"/>
    <rect width="280" height="34" rx="8" fill="#FFFBEB"/>
    <text x="15" y="23" fill="#92400E" font-family="sans-serif" font-size="13" font-weight="bold">PUBLISH_JOB (Dispatch)</text>
    <text x="15" y="55" fill="#475569" font-family="monospace" font-size="11">id: uuid (PK)</text>
    <text x="15" y="75" fill="#475569" font-family="monospace" font-size="11">artifact_id: uuid (FK)</text>
    <text x="15" y="95" fill="#475569" font-family="monospace" font-size="11">channel: youtube|linkedin|x|web</text>
    <text x="15" y="115" fill="#475569" font-family="monospace" font-size="11">scheduled_at: timestamp</text>
    <text x="15" y="135" fill="#475569" font-family="monospace" font-size="11">delivery_status: SENT|FAILED</text>
    <text x="15" y="155" fill="#475569" font-family="monospace" font-size="11">external_post_id: string</text>
  </g>
</svg>