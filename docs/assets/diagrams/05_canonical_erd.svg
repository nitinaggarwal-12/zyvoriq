<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" fill="#07090E" rx="16"/>
  <rect x="1" y="1" width="1198" height="698" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="15"/>

  <text x="50" y="55" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="bold">ARC-001 / DAT-001: Canonical Relational Entity-Relationship Model</text>
  <rect x="970" y="35" width="180" height="28" rx="14" fill="rgba(20,184,166,0.15)" stroke="#14B8A6" stroke-width="1"/>
  <text x="990" y="54" fill="#2DD4BF" font-family="sans-serif" font-size="12" font-weight="600">Database Schema (ERD)</text>

  <!-- Tenant -->
  <rect x="50" y="100" width="220" height="120" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <rect x="50" y="100" width="220" height="30" rx="8" fill="#334155"/>
  <text x="70" y="122" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">TENANT (Billing Scope)</text>
  <text x="70" y="150" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="70" y="170" fill="#94A3B8" font-family="monospace" font-size="12">name: string</text>
  <text x="70" y="190" fill="#94A3B8" font-family="monospace" font-size="12">plan_tier: string</text>

  <line x1="270" y1="160" x2="350" y2="160" stroke="#22D3EE" stroke-width="2"/>

  <!-- Workspace -->
  <rect x="350" y="100" width="240" height="140" rx="8" fill="#151D2F" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="350" y="100" width="240" height="30" rx="8" fill="#0F766E"/>
  <text x="370" y="122" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">WORKSPACE (Persona)</text>
  <text x="370" y="150" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="370" y="170" fill="#94A3B8" font-family="monospace" font-size="12">tenant_id: uuid (FK)</text>
  <text x="370" y="190" fill="#94A3B8" font-family="monospace" font-size="12">persona_vector: vector</text>
  <text x="370" y="210" fill="#94A3B8" font-family="monospace" font-size="12">autonomy_mode: string</text>

  <line x1="590" y1="160" x2="670" y2="160" stroke="#22D3EE" stroke-width="2"/>

  <!-- Project -->
  <rect x="670" y="100" width="220" height="120" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <rect x="670" y="100" width="220" height="30" rx="8" fill="#334155"/>
  <text x="690" y="122" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">PROJECT (Campaign)</text>
  <text x="690" y="150" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="690" y="170" fill="#94A3B8" font-family="monospace" font-size="12">workspace_id: uuid (FK)</text>
  <text x="690" y="190" fill="#94A3B8" font-family="monospace" font-size="12">title: string</text>

  <!-- Master Asset -->
  <line x1="780" y1="220" x2="780" y2="300" stroke="#22D3EE" stroke-width="2"/>
  <rect x="670" y="300" width="220" height="130" rx="8" fill="#151D2F" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="670" y="300" width="220" height="30" rx="8" fill="#4338CA"/>
  <text x="690" y="322" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">MASTER_ASSET (Concept)</text>
  <text x="690" y="350" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="690" y="370" fill="#94A3B8" font-family="monospace" font-size="12">project_id: uuid (FK)</text>
  <text x="690" y="390" fill="#94A3B8" font-family="monospace" font-size="12">raw_prompt: text</text>
  <text x="690" y="410" fill="#94A3B8" font-family="monospace" font-size="12">status: string</text>

  <!-- Modality Artifact -->
  <line x1="670" y1="365" x2="570" y2="365" stroke="#22D3EE" stroke-width="2"/>
  <rect x="330" y="300" width="240" height="150" rx="8" fill="#151D2F" stroke="#EC4899" stroke-width="1.5"/>
  <rect x="330" y="300" width="240" height="30" rx="8" fill="#BE185D"/>
  <text x="350" y="322" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">MODALITY_ARTIFACT</text>
  <text x="350" y="350" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="350" y="370" fill="#94A3B8" font-family="monospace" font-size="12">master_asset_id: uuid</text>
  <text x="350" y="390" fill="#94A3B8" font-family="monospace" font-size="12">modality: string</text>
  <text x="350" y="410" fill="#94A3B8" font-family="monospace" font-size="12">payload: jsonb</text>
  <text x="350" y="430" fill="#94A3B8" font-family="monospace" font-size="12">c2pa_manifest_id: string</text>

  <!-- Veritas Assessment -->
  <line x1="450" y1="450" x2="450" y2="520" stroke="#10B981" stroke-width="2"/>
  <rect x="330" y="520" width="240" height="140" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="330" y="520" width="240" height="30" rx="8" fill="#047857"/>
  <text x="350" y="542" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">VERITAS_ASSESSMENT</text>
  <text x="350" y="570" fill="#D1FAE5" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="350" y="590" fill="#D1FAE5" font-family="monospace" font-size="12">artifact_id: uuid (FK)</text>
  <text x="350" y="610" fill="#D1FAE5" font-family="monospace" font-size="12">composite_vqs: float</text>
  <text x="350" y="630" fill="#D1FAE5" font-family="monospace" font-size="12">gate_decision: string</text>

  <!-- Publish Job -->
  <line x1="330" y1="375" x2="230" y2="375" stroke="#F59E0B" stroke-width="2"/>
  <rect x="50" y="320" width="180" height="110" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="50" y="320" width="180" height="30" rx="8" fill="#B45309"/>
  <text x="65" y="342" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">PUBLISH_JOB</text>
  <text x="65" y="370" fill="#94A3B8" font-family="monospace" font-size="12">id: uuid (PK)</text>
  <text x="65" y="390" fill="#94A3B8" font-family="monospace" font-size="12">channel: string</text>
  <text x="65" y="410" fill="#94A3B8" font-family="monospace" font-size="12">scheduled_at: ts</text>
</svg>