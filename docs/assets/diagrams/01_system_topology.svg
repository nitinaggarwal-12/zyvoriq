<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" rx="16"/>
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="50" y="55" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="bold">ARC-001: End-to-End System Topology &amp; Service Architecture</text>
  <rect x="980" y="35" width="170" height="28" rx="14" fill="rgba(20,184,166,0.15)" stroke="#14B8A6" stroke-width="1"/>
  <text x="1005" y="54" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Zyvoriq Production</text>

  <!-- Layer 1: Client & Edge Gateway -->
  <rect x="50" y="90" width="1100" height="100" rx="12" fill="#0D121F" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="120" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">CLIENT &amp; EDGE ACCESS LAYER</text>
  
  <rect x="80" y="135" width="480" height="40" rx="8" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="180" y="160" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Next.js 15 App Router (React 19 + Tailwind)</text>
  
  <rect x="640" y="135" width="480" height="40" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="730" y="160" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">API Gateway BFF (JWT Session / Rate Limiter / SSE)</text>

  <!-- Connectors -->
  <line x1="600" y1="190" x2="600" y2="230" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4"/>

  <!-- Layer 2: Core Orchestration & Assurance Swarm -->
  <rect x="50" y="230" width="1100" height="230" rx="12" fill="#0D121F" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="260" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">CORE SWARM ORCHESTRATION &amp; ASSURANCE LAYER</text>

  <!-- Sub-box: Director -->
  <rect x="80" y="280" width="320" height="150" rx="10" fill="#151D2F" stroke="#6366F1" stroke-width="1.5"/>
  <text x="100" y="310" fill="#A5B4FC" font-family="sans-serif" font-size="16" font-weight="bold">Director Swarm</text>
  <text x="100" y="340" fill="#94A3B8" font-family="sans-serif" font-size="13">• Research &amp; Grounding Agent</text>
  <text x="100" y="365" fill="#94A3B8" font-family="sans-serif" font-size="13">• Scripting &amp; Narrative Agent</text>
  <text x="100" y="390" fill="#94A3B8" font-family="sans-serif" font-size="13">• Code AST &amp; Diagram Compiler</text>

  <!-- Sub-box: Veritas QA -->
  <rect x="440" y="280" width="320" height="150" rx="10" fill="#151D2F" stroke="#14B8A6" stroke-width="2" filter="url(#glow)"/>
  <text x="460" y="310" fill="#2DD4BF" font-family="sans-serif" font-size="16" font-weight="bold">Veritas Quality Matrix</text>
  <text x="460" y="340" fill="#94A3B8" font-family="sans-serif" font-size="13">• Multi-Engine Consensus (Gemini+Claude)</text>
  <text x="460" y="365" fill="#94A3B8" font-family="sans-serif" font-size="13">• Automated Grounding Fact-Checker</text>
  <text x="460" y="390" fill="#94A3B8" font-family="sans-serif" font-size="13">• Closed-Loop Auto-Repair Engine</text>

  <!-- Sub-box: Omnichannel -->
  <rect x="800" y="280" width="320" height="150" rx="10" fill="#151D2F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="820" y="310" fill="#FCD34D" font-family="sans-serif" font-size="16" font-weight="bold">Omnichannel Publisher</text>
  <text x="820" y="340" fill="#94A3B8" font-family="sans-serif" font-size="13">• YouTube (16:9 &amp; 9:16 Shorts)</text>
  <text x="820" y="365" fill="#94A3B8" font-family="sans-serif" font-size="13">• LinkedIn &amp; X Post Formatter</text>
  <text x="820" y="390" fill="#94A3B8" font-family="sans-serif" font-size="13">• C2PA Provenance Signer</text>

  <!-- Connectors -->
  <line x1="600" y1="460" x2="600" y2="500" stroke="#14B8A6" stroke-width="2"/>

  <!-- Layer 3: Model Router -->
  <rect x="250" y="500" width="700" height="70" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="430" y="530" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold">Intelligent Foundation Model Router</text>
  <text x="350" y="555" fill="#94A3B8" font-family="sans-serif" font-size="12">Dynamic Workload Routing: Gemini 2.5 Pro | Claude 3.5 Sonnet | Google Veo 2 | DeepMind Neural TTS</text>

  <!-- Connectors -->
  <line x1="600" y1="570" x2="600" y2="610" stroke="#38BDF8" stroke-width="2"/>

  <!-- Layer 4: Storage & Persistence -->
  <rect x="50" y="610" width="1100" height="140" rx="12" fill="#0D121F" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="640" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">PERSISTENCE, VECTOR MEMORY &amp; QUEUE BUS</text>

  <rect x="80" y="660" width="320" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="120" y="690" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">PostgreSQL 16 + pgvector</text>
  <text x="110" y="715" fill="#94A3B8" font-family="sans-serif" font-size="12">Tenant RLS &amp; Persona Style Memory</text>

  <rect x="440" y="660" width="320" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="510" y="690" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Redis BullMQ Queues</text>
  <text x="490" y="715" fill="#94A3B8" font-family="sans-serif" font-size="12">Async Swarm Task Scheduling</text>

  <rect x="800" y="660" width="320" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="860" y="690" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">S3 / GCS Object Store</text>
  <text x="840" y="715" fill="#94A3B8" font-family="sans-serif" font-size="12">Compiled MP4s, Audio &amp; C2PA Manifests</text>
</svg>