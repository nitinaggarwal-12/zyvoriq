<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <rect width="1200" height="500" fill="#07090E" rx="16"/>
  <rect x="1" y="1" width="1198" height="498" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" rx="15"/>

  <text x="50" y="55" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="bold">REL-001: Zero-Downtime CI/CD Pipeline &amp; Canary Rollout</text>
  <rect x="970" y="35" width="180" height="28" rx="14" fill="rgba(34,211,238,0.15)" stroke="#22D3EE" stroke-width="1"/>
  <text x="990" y="54" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">CI/CD Deployment</text>

  <!-- Stage 1 -->
  <rect x="50" y="150" width="160" height="160" rx="10" fill="#151D2F" stroke="#64748B" stroke-width="1.5"/>
  <text x="70" y="195" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">1. Git Push</text>
  <text x="70" y="225" fill="#94A3B8" font-family="sans-serif" font-size="12">• Main Branch</text>
  <text x="70" y="250" fill="#94A3B8" font-family="sans-serif" font-size="12">• Webhook Trigger</text>

  <line x1="210" y1="230" x2="270" y2="230" stroke="#22D3EE" stroke-width="2"/>

  <!-- Stage 2 -->
  <rect x="270" y="150" width="180" height="160" rx="10" fill="#151D2F" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="290" y="195" fill="#2DD4BF" font-family="sans-serif" font-size="14" font-weight="bold">2. Test &amp; Compile</text>
  <text x="290" y="225" fill="#94A3B8" font-family="sans-serif" font-size="12">• tsc --noEmit</text>
  <text x="290" y="250" fill="#94A3B8" font-family="sans-serif" font-size="12">• Vitest Units</text>
  <text x="290" y="275" fill="#94A3B8" font-family="sans-serif" font-size="12">• Golden Evals</text>

  <line x1="450" y1="230" x2="510" y2="230" stroke="#22D3EE" stroke-width="2"/>

  <!-- Stage 3 -->
  <rect x="510" y="150" width="180" height="160" rx="10" fill="#151D2F" stroke="#6366F1" stroke-width="1.5"/>
  <text x="530" y="195" fill="#A5B4FC" font-family="sans-serif" font-size="14" font-weight="bold">3. Docker Build</text>
  <text x="530" y="225" fill="#94A3B8" font-family="sans-serif" font-size="12">• Next Standalone</text>
  <text x="530" y="250" fill="#94A3B8" font-family="sans-serif" font-size="12">• Image SHA Hash</text>
  <text x="530" y="275" fill="#94A3B8" font-family="sans-serif" font-size="12">• Registry Push</text>

  <line x1="690" y1="230" x2="750" y2="230" stroke="#22D3EE" stroke-width="2"/>

  <!-- Stage 4 -->
  <rect x="750" y="150" width="180" height="160" rx="10" fill="#151D2F" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="770" y="195" fill="#FCD34D" font-family="sans-serif" font-size="14" font-weight="bold">4. Canary (10%)</text>
  <text x="770" y="225" fill="#94A3B8" font-family="sans-serif" font-size="12">• Health Probes</text>
  <text x="770" y="250" fill="#94A3B8" font-family="sans-serif" font-size="12">• 5xx Error Burn</text>
  <text x="770" y="275" fill="#94A3B8" font-family="sans-serif" font-size="12">• TTFT Latency</text>

  <line x1="930" y1="230" x2="990" y2="230" stroke="#10B981" stroke-width="2"/>

  <!-- Stage 5 -->
  <rect x="990" y="150" width="160" height="160" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1005" y="195" fill="#A7F3D0" font-family="sans-serif" font-size="14" font-weight="bold">5. 100% GA</text>
  <text x="1005" y="225" fill="#D1FAE5" font-family="sans-serif" font-size="12">• Traffic Shifted</text>
  <text x="1005" y="250" fill="#D1FAE5" font-family="sans-serif" font-size="12">• Zero Downtime</text>
  <text x="1005" y="275" fill="#D1FAE5" font-family="sans-serif" font-size="12">• CDN Cache Purged</text>
</svg>