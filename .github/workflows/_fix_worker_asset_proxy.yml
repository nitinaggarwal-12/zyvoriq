name: Apply worker asset proxy fix

on:
  push:
    branches:
      - fix/worker-asset-proxy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worker-asset-proxy
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/qa/apply_worker_asset_proxy_patch.py
      - name: Syntax QA
        run: node --check scripts/reel_worker_v2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build QA
        run: npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/_fix_worker_asset_proxy.yml
          rm scripts/qa/apply_worker_asset_proxy_patch.py
          git config user.name "zyvoriq-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(reels): proxy worker-owned assets over private network"
          git push origin HEAD:fix/worker-asset-proxy
