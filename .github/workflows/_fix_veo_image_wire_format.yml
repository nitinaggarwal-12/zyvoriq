name: Apply Veo image wire-format fix

on:
  push:
    branches:
      - fix/veo-image-wire-format

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veo-image-wire-format
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/tmp_patch_veo_wire.py

      - name: Syntax QA
        run: node --check scripts/reel_worker_v2.mjs

      - name: Veo image wire-format contract QA
        run: |
          grep -F 'instance.image = { mimeType: "image/png", bytesBase64Encoded: ref.buffer.toString("base64") }' scripts/reel_worker_v2.mjs
          ! grep -F 'instance.image = { inlineData:' scripts/reel_worker_v2.mjs
          grep -F 'recoverLegacyVeoInlineDataFailures' scripts/reel_worker_v2.mjs
          grep -F 'version: "v2.3"' scripts/reel_worker_v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Full build QA
        run: npm run build

      - name: Commit fix
        run: |
          rm scripts/tmp_patch_veo_wire.py .github/workflows/_fix_veo_image_wire_format.yml
          git config user.name "zyvoriq-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/reel_worker_v2.mjs scripts/tmp_patch_veo_wire.py .github/workflows/_fix_veo_image_wire_format.yml
          git commit -m "fix(reels): use Veo-compatible image payload"
          git push origin HEAD:fix/veo-image-wire-format
