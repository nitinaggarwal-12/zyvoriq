name: Apply shot review UI fix

on:
  push:
    branches:
      - fix/shot-review-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shot-review-ui
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/_patch_shot_review.py
      - name: Build QA
        run: |
          npm ci
          npm run build
      - name: UI contract QA
        run: |
          grep -q 'Review shot' app/studio/ReelStudio.tsx
          grep -q 'selectedShotId' app/studio/ReelStudio.tsx
          grep -q 'previewVideoUrl' app/studio/ReelStudio.tsx
          grep -q 'controls playsInline' app/studio/ReelStudio.tsx
          grep -q 'shot.asset?.videoUrl' app/studio/ReelStudio.tsx
      - name: Commit fix
        run: |
          rm .github/workflows/_fix_shot_review.yml scripts/_patch_shot_review.py
          git config user.name 'zyvoriq-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/studio/ReelStudio.tsx .github/workflows/_fix_shot_review.yml scripts/_patch_shot_review.py
          git commit -m 'fix(studio): add generated shot review playback'
          git push origin HEAD:fix/shot-review-ui
