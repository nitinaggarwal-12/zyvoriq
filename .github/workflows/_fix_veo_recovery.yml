name: Apply Veo crash-safe recovery fix

on:
  push:
    branches:
      - fix/veo-crash-safe-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/veo-crash-safe-recovery
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/tmp_patch_veo.py

      - name: Syntax QA
        run: node --check scripts/reel_worker_v2.mjs

      - name: Veo recovery contract QA
        shell: bash
        run: |
          grep -q 'recoverLegacyAmbiguousVeoFailures' scripts/reel_worker_v2.mjs
          grep -q 'veo-dispatch-started' scripts/reel_worker_v2.mjs
          grep -q 'veo-recovery-dispatch-started' scripts/reel_worker_v2.mjs
          grep -q 'AMBIGUOUS_VEO_DISPATCH_AFTER_BOUNDED_RECOVERY' scripts/reel_worker_v2.mjs
          if grep -q 'Number(op.attempt || 0) > 1' scripts/reel_worker_v2.mjs; then exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Full build QA
        run: npm run build

      - name: Commit fix
        shell: bash
        run: |
          rm scripts/tmp_patch_veo.py .github/workflows/_fix_veo_recovery.yml
          git config user.name "zyvoriq-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/reel_worker_v2.mjs scripts/tmp_patch_veo.py .github/workflows/_fix_veo_recovery.yml
          git commit -m "fix(reels): make Veo dispatch crash-safe"
          git push origin HEAD:fix/veo-crash-safe-recovery
